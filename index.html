<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b3fd6">
<title>Fuxis Mathe-Abenteuer · 2. Klasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#4a2fb8; --bg2:#7a3fd6; --bg3:#2f6fe0;
    --ink:#241d4f; --ink-soft:#6b64a0;
    --card:#ffffff; --card-tint:#f4f1ff;
    --brand:#5b3fd6; --brand-deep:#41279e;
    --accent:#ff8a3d; --accent-deep:#d96a1a;
    --ok:#22c55e; --ok-deep:#15803d; --ok-tint:#e8fbef;
    --bad:#ef4444; --bad-tint:#feecec;
    --star:#ffcc33; --gold:#f59e0b;
    --r-lg:28px; --r-md:20px; --r-sm:14px;
    --chunk:0 6px 0 rgba(0,0,0,.18);
    --shadow:0 14px 34px rgba(23,10,80,.28);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:"Baloo 2","Segoe UI Rounded","SF Pro Rounded","Comic Sans MS",system-ui,sans-serif;
    background:linear-gradient(155deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%) fixed;
    color:var(--ink);
    overflow-x:hidden;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    min-height:100dvh;
  }
  #bgfx{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #bgfx span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; animation:drift 16s ease-in-out infinite alternate; }
  #bgfx span:nth-child(1){ width:44vmax; height:44vmax; background:#8b5cf6; top:-18vmax; left:-14vmax; }
  #bgfx span:nth-child(2){ width:36vmax; height:36vmax; background:#f59e0b; bottom:-16vmax; right:-12vmax; opacity:.32; animation-delay:-8s; }
  #bgfx span:nth-child(3){ width:26vmax; height:26vmax; background:#22d3ee; top:36%; right:-14vmax; opacity:.24; animation-delay:-4s; }
  @keyframes drift{ from{transform:translate(0,0) scale(1)} to{transform:translate(5vmax,3vmax) scale(1.15)} }
  #fx{ position:fixed; inset:0; z-index:60; pointer-events:none; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001s !important; transition-duration:.001s !important; } }

  #app{ position:relative; z-index:1; max-width:780px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); min-height:100dvh; display:flex; flex-direction:column; }
  .screen{ animation:screenIn .38s cubic-bezier(.2,.9,.3,1.2) both; flex:1; display:flex; flex-direction:column; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(22px) scale(.98); } to{ opacity:1; transform:none; } }

  .top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.3); }
  .brand .logo{ font-size:40px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); animation:bob 3s ease-in-out infinite; }
  .brand h1{ margin:0; font-size:clamp(19px,4.6vw,26px); line-height:1.05; }
  .brand small{ display:block; font-size:.62em; font-weight:500; opacity:.85; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer;
    background:rgba(255,255,255,.94); color:var(--ink); font-family:inherit; font-weight:700;
    border-radius:999px; padding:9px 14px; font-size:15px;
    box-shadow:0 4px 12px rgba(23,10,80,.25); transition:transform .12s;
  }
  .chip:active{ transform:scale(.92); }
  .chip.stat{ cursor:default; }

  .levelwrap{ background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:8px 14px; margin:2px 0 14px; display:flex; align-items:center; gap:12px; backdrop-filter:blur(8px); }
  .levelbadge{ background:linear-gradient(135deg,var(--star),#f59e0b); color:#4c2d00; font-weight:800; border-radius:999px; padding:4px 12px; font-size:14px; box-shadow:inset 0 -2px 0 rgba(0,0,0,.15); white-space:nowrap; }
  .xpbar{ flex:1; height:14px; background:rgba(255,255,255,.3); border-radius:999px; overflow:hidden; }
  .xpfill{ height:100%; border-radius:999px; background:linear-gradient(90deg,#ffd93d,#ff9f1c); box-shadow:inset 0 -3px 4px rgba(0,0,0,.15); transition:width .6s cubic-bezier(.2,.8,.3,1); }
  .xptext{ color:#fff; font-size:13px; font-weight:700; white-space:nowrap; opacity:.95; }

  .foxrow{ display:flex; align-items:center; gap:12px; margin:8px 0 16px; }
  .fox{
    flex:0 0 auto; width:74px; height:74px; border-radius:50%; font-size:44px;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.5), rgba(255,255,255,.12));
    border:2px solid rgba(255,255,255,.4);
    box-shadow:0 10px 24px rgba(23,10,80,.35), inset 0 -6px 10px rgba(0,0,0,.1);
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-7px) rotate(2deg)} }
  .bubble{
    position:relative; background:#fff; border-radius:20px; padding:13px 17px;
    font-size:17px; line-height:1.35; box-shadow:var(--shadow);
  }
  .bubble::before{ content:""; position:absolute; left:-11px; top:24px; border:11px solid transparent; border-right-color:#fff; border-left:0; }
  .bubble b{ color:var(--brand); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px; }
  .mod{
    position:relative; text-align:left; border:none; cursor:pointer; font-family:inherit; color:var(--ink);
    background:linear-gradient(140deg,var(--card),var(--card-tint));
    border-radius:var(--r-lg); padding:18px 16px 15px;
    box-shadow:var(--shadow), var(--chunk);
    transition:transform .14s cubic-bezier(.2,.8,.3,1.4);
    overflow:hidden;
  }
  .mod::after{ content:""; position:absolute; inset:0; background:radial-gradient(120px 60px at 85% -10%, rgba(255,255,255,.85), transparent); pointer-events:none; }
  .mod:active{ transform:translateY(4px) scale(.975); box-shadow:var(--shadow), 0 2px 0 rgba(0,0,0,.18); }
  .mod .ic{ display:inline-flex; width:58px; height:58px; border-radius:18px; align-items:center; justify-content:center; font-size:32px; margin-bottom:10px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.14), 0 6px 14px rgba(23,10,80,.18); }
  .mod h3{ margin:0 0 3px; font-size:20px; }
  .mod p{ margin:0; font-size:14px; color:var(--ink-soft); font-weight:500; }
  .mod .meter{ margin-top:12px; height:10px; border-radius:999px; background:#e9e5ff; overflow:hidden; }
  .mod .meter i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#a78bfa,#5b3fd6); }
  .mod .best{ margin-top:6px; font-size:13px; font-weight:700; color:var(--brand); }
  .mod .fresh{ position:absolute; top:12px; right:14px; font-size:13px; background:var(--star); color:#5a4300; padding:3px 10px; border-radius:999px; font-weight:800; box-shadow:var(--chunk); }

  .hero{ background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow), var(--chunk); padding:22px; }
  .hero h2{ margin:4px 0 4px; font-size:24px; }
  .hero .sub{ margin:0 0 4px; color:var(--ink-soft); font-weight:600; }
  .steps{ list-style:none; margin:14px 0 4px; padding:0; }
  .steps li{ background:var(--card-tint); border-radius:var(--r-sm); padding:13px 15px; margin-bottom:9px; font-size:18px; line-height:1.4; animation:stepIn .3s ease both; }
  .steps li b{ color:var(--brand); }
  @keyframes stepIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
  .stepdots{ display:flex; gap:6px; justify-content:center; margin:4px 0 2px; }
  .stepdots i{ width:10px; height:10px; border-radius:50%; background:#ddd6fe; transition:.2s; }
  .stepdots i.on{ background:var(--brand); transform:scale(1.25); }
  .stepdots i.done{ background:#c4b5fd; }

  .btnrow{ display:flex; gap:11px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:19px; color:#fff; letter-spacing:.3px;
    background:linear-gradient(160deg,#7c5cff,var(--brand)); border-radius:999px;
    padding:15px 26px; min-height:64px; min-width:120px;
    box-shadow:var(--chunk), 0 10px 22px rgba(60,30,160,.35);
    transition:transform .12s, box-shadow .12s;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.2), 0 4px 10px rgba(60,30,160,.3); }
  .btn.orange{ background:linear-gradient(160deg,#ffa14a,var(--accent-deep)); box-shadow:0 6px 0 rgba(150,80,10,.55), 0 10px 22px rgba(220,130,30,.35); }
  .btn.orange:active{ box-shadow:0 2px 0 rgba(150,80,10,.55); }
  .btn.ghost{ background:#f0edff; color:var(--brand); box-shadow:0 4px 0 #ddd5f7; text-shadow:none; }
  .btn.ghost:active{ box-shadow:0 1px 0 #ddd5f7; transform:translateY(3px); }
  .btn.small{ min-height:52px; padding:10px 20px; font-size:16px; }
  .btn.back{ background:rgba(255,255,255,.2); box-shadow:none; border:1.5px solid rgba(255,255,255,.45); min-height:52px; padding:10px 18px; font-size:16px; backdrop-filter:blur(6px); }
  .btn:disabled{ opacity:.45; cursor:default; transform:none !important; }

  .headline{ color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.3); margin:6px 0 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .headline h2{ margin:0; font-size:clamp(22px,5.4vw,30px); }
  .qbadge{ background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.4); color:#fff; border-radius:999px; padding:6px 14px; font-size:14px; font-weight:800; backdrop-filter:blur(6px); white-space:nowrap; }

  .track{ height:16px; border-radius:999px; background:rgba(255,255,255,.25); overflow:hidden; margin-bottom:14px; box-shadow:inset 0 2px 5px rgba(0,0,0,.15); }
  .track i{ display:block; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#ffd93d,#ff9f1c); transition:width .45s cubic-bezier(.2,.8,.3,1); }
  .qcard{ background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow), var(--chunk); padding:20px 18px; text-align:center; position:relative; }
  .qcard .qtext{ font-size:clamp(19px,4.5vw,24px); font-weight:600; line-height:1.4; }
  .bigq{ font-size:clamp(34px,9vw,52px); font-weight:800; margin:10px 0; line-height:1.15; letter-spacing:1px; }
  .bigq .hole{ color:#c4b5fd; }
  .visual{ font-size:clamp(20px,5vw,30px); margin:8px 0; line-height:1.65; }
  .streak{ position:absolute; top:-14px; right:-8px; background:linear-gradient(135deg,#ff9f1c,#ff5e3a); color:#fff; font-size:13px; font-weight:800; border-radius:999px; padding:4px 11px; box-shadow:var(--chunk); animation:pop .35s; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .option{
    border:3px solid #e8e3ff; background:#fff; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:clamp(23px,6vw,32px); color:var(--ink);
    border-radius:var(--r-md); padding:16px 8px; min-height:78px;
    box-shadow:0 4px 0 #ddd5f7; transition:transform .1s, box-shadow .1s;
  }
  .option:active{ transform:translateY(3px); box-shadow:0 1px 0 #ddd5f7; }
  .option.good{ border-color:var(--ok); background:var(--ok-tint); color:var(--ok-deep); box-shadow:0 4px 0 #b5ecc7; animation:pop .4s; }
  .option.ohno{ border-color:var(--bad); background:var(--bad-tint); animation:shake .4s; }
  @keyframes pop{ 0%{transform:scale(.8)} 55%{transform:scale(1.09)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }

  .numdisplay{
    text-align:center; font-size:clamp(34px,9vw,46px); font-weight:800; min-height:64px;
    background:var(--card-tint); border-radius:var(--r-sm); padding:8px; letter-spacing:6px; margin-top:12px;
    border:3px solid #e8e3ff;
  }
  .numpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px auto 0; max-width:340px; }
  .numpad button{
    border:none; cursor:pointer; font-family:inherit; font-size:27px; font-weight:800;
    background:#f0edff; color:var(--ink); border-radius:var(--r-sm); min-height:62px;
    box-shadow:0 4px 0 #ddd5f7; transition:transform .08s, box-shadow .08s;
  }
  .numpad button:active{ transform:translateY(3px); box-shadow:0 1px 0 #ddd5f7; }
  .numpad .okb{ background:linear-gradient(160deg,#34d17b,#16a34a); color:#fff; box-shadow:0 4px 0 #0e7a36; text-shadow:0 1px 2px rgba(0,0,0,.2); font-size:24px; }
  .numpad .delb{ background:#ffe9d6; color:var(--accent-deep); box-shadow:0 4px 0 #f5cdb0; font-size:22px; }

  .feedback{ min-height:56px; margin-top:14px; display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:19px; font-weight:800; border-radius:var(--r-sm); padding:10px 16px; transition:.25s; }
  .feedback.hidden{ visibility:hidden; }
  .feedback.good{ background:var(--ok-tint); color:var(--ok-deep); animation:stepIn .3s; }
  .feedback.bad{ background:var(--bad-tint); color:#b91c1c; animation:shake .4s; }
  .feedback.info{ background:#fff7e3; color:#92600a; }

  .medal{ font-size:96px; text-align:center; animation:pop .5s both; filter:drop-shadow(0 10px 18px rgba(0,0,0,.25)); }
  .starsline{ font-size:38px; text-align:center; letter-spacing:4px; margin:6px 0; }
  .starsline span{ display:inline-block; animation:pop .45s both; }
  .xpplus{ text-align:center; font-size:22px; font-weight:800; color:var(--ok-deep); background:var(--ok-tint); border-radius:999px; padding:8px 18px; display:table; margin:10px auto; }
  .stat2{ display:flex; gap:12px; justify-content:center; margin:10px 0 2px; flex-wrap:wrap; }
  .stat2 .chip{ font-size:16px; }

  .overlay{ position:fixed; inset:0; z-index:70; background:rgba(25,12,70,.66); backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center; padding:22px; animation:fadeIn .25s; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .levelup{ text-align:center; color:#fff; animation:pop .5s; }
  .levelup .big{ font-size:76px; animation:bob 1.4s ease-in-out infinite; display:block; }
  .levelup h2{ font-size:clamp(30px,8vw,44px); margin:8px 0; text-shadow:0 3px 10px rgba(0,0,0,.4); }

  .center{ text-align:center; }
  .footnote{ text-align:center; color:rgba(255,255,255,.75); font-size:13px; margin-top:auto; padding-top:18px; font-weight:600; }
</style>
</head>
<body>
<div id="bgfx"><span></span><span></span><span></span></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app" role="main"></div>
<script src="fuxi-core.js"></script>
<script src="fuxi-ui.js"></script>
</body>
</html>
